# GoLB Configuration
# Hot reload: send SIGHUP to re-read this file without restart.
#   kill -HUP $(pidof golb)
# Note: TLS changes require a full restart.

server:
  port: 3030

pool:
  # algorithm: round_robin | least_connections | weighted_round_robin
  algorithm: round_robin
  backends:
    - url: http://localhost:8081
      weight: 1
    - url: http://localhost:8082
      weight: 1
    - url: http://localhost:8083
      weight: 1

health_check:
  path: /health   # must return 2xx; use / when testing with python3 -m http.server
  interval: 10s
  timeout: 2s
  unhealthy_threshold: 3   # consecutive failures before marking dead
  healthy_threshold: 2     # consecutive successes before marking alive

admin:
  port: 9090   # set to 0 to disable admin API

rate_limit:
  enabled: false               # enable token bucket rate limiting
  requests_per_second: 1000    # token refill rate
  burst: 200                   # max burst size
  per_ip: true                 # per-IP (true) or global (false)

metrics:
  enabled: true                # enable Prometheus metrics at /metrics
  port: 0                      # 0 = serve on admin port; set to expose on a dedicated port

circuit_breaker:
  enabled: false               # enable per-backend circuit breaker
  failure_threshold: 5         # consecutive failures before opening circuit
  success_threshold: 2         # consecutive successes in half-open to close
  timeout: 30s                 # how long to stay open before probing (half-open)

tls:
  enabled: false               # enable HTTPS frontend termination
  cert_file: ""                # path to PEM certificate file
  key_file: ""                 # path to PEM private key file
  min_version: "1.2"           # minimum TLS version: "1.2" or "1.3"

sticky_sessions:
  enabled: false               # enable cookie-based session affinity
  cookie_name: golb_backend    # name of the sticky session cookie
  ttl: 1h                      # cookie TTL (e.g. 30m, 2h)
